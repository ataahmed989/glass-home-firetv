plugins {
    id "com.android.application"
}

android {
    namespace "app.glasshome.launcher"
    compileSdk 35

    // Releases are numbered by the build that made them (see .github/workflows/release.yml): the tag
    // "v1.0.<build>" is what the app's updater compares with its own versionCode
    def buildNumber = (System.getenv("BUILD_NUMBER") ?: "1").toInteger()

    defaultConfig {
        applicationId "app.glasshome.launcher"
        // Fire TV Stick 4K Plus runs Fire OS 8 (Android 11, API 30)
        minSdk 30
        targetSdk 35
        versionCode buildNumber
        versionName "1.0." + buildNumber
    }

    // The key the TVs' Glass Home carries, so that every build and every release installs over it. It is
    // kept out of the repository: GitHub's release workflow writes it here from the GLASSHOME_KEYSTORE
    // secret (see README); without it, builds are signed with this machine's debug key
    def releaseKey = file("glasshome-release.jks")
    signingConfigs {
        glasshome {
            storeFile releaseKey
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
    }

    buildTypes {
        debug {
            if (releaseKey.exists()) signingConfig signingConfigs.glasshome
        }
        release {
            minifyEnabled false
            signingConfig releaseKey.exists() ? signingConfigs.glasshome : signingConfigs.debug
            // As the builds the TVs had before: ADB's run-as can still write the TMDB token and app order (see README)
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // Icons are already PNG-optimised; keep them byte-for-byte
    androidResources {
        noCompress "png", "jpg", "ttf"
    }

    testOptions {
        unitTests {
            includeAndroidResources = true
            all {
                // Robolectric fetches android-all from Maven Central; use Google's mirror here too
                systemProperty "robolectric.dependency.repo.url", "https://maven-central.storage-download.googleapis.com/maven2/"
                systemProperty "screenshot.dir", "${rootDir}/screenshots"
                // Optional: path to a file holding a TMDB token, for the live featured-titles test (never committed)
                systemProperty "tmdb.token.file", project.findProperty("tmdbTokenFile") ?: ""
                // -PnetRecord=true records missing TMDB/ESPN responses into src/test/fixtures (see Fixtures)
                systemProperty "net.record", project.findProperty("netRecord") ?: "false"
                // -Pclip=true records the frames of a tile being moved (TileMenuTest.recordAMove)
                systemProperty "clip", project.findProperty("clip") ?: "false"
                maxHeapSize = "3g"
            }
        }
    }
}

dependencies {
    implementation "androidx.recyclerview:recyclerview:1.3.2"

    testImplementation "junit:junit:4.13.2"
    testImplementation "org.robolectric:robolectric:4.14.1"
}
